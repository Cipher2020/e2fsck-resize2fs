name: Build static tools
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross compiler
        run: |
          sudo apt update
          sudo apt install -y aarch64-linux-musl-gcc make wget tar

      - name: Build e2fsprogs 1.46.5
        run: |
          wget https://github.com/tytso/e2fsprogs/archive/refs/tags/v1.46.5.tar.gz
          tar -xf v1.46.5.tar.gz
          cd e2fsprogs-1.46.5
          ./configure --host=aarch64-linux-musl --enable-static --disable-shared
          make -j$(nproc)
          cp bin/e2fsck ../
          cp bin/resize2fs ../
          cd ..

      - name: Build parted-3.3
        run: |
          export CFLAGS="-Wno-implicit-function-declaration"
          wget https://ftp.gnu.org/gnu/parted/parted-3.3.tar.xz
          tar -xf parted-3.3.tar.xz
          cd parted-3.3
          ./configure --host=aarch64-linux-musl --enable-static --disable-shared
          make -j$(nproc)
          cp parted ../
          cd ..

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          path: |
            e2fsck
            resize2fs
            parted
